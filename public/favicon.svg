<!--
  The lab mark: Archivo Regular "B", knocked out of the accent.

  Proportioned from the reference mark in the brief, measured rather than
  eyeballed: a cap height of 58.8% of the tile, centred both ways, a corner
  radius of 8.8% of the side, and a stroke of 13.62% of the cap. That last
  number is what sets the weight, and it identified the face before the zip's
  own about.txt confirmed it: Archivo, at 400, matching to three decimal
  places. Only the violet was not ours, so the ground stays the site accent.

  The letter is an outline rather than a <text> element, because a favicon is
  rendered in a context that loads no webfonts - `font-family: Archivo` there
  falls back to whatever the machine happens to have. Drawn from the same file
  the site loads, @fontsource-variable/archivo.

  Regular, not the body text's bold: at 32px the counters of a bold B close up
  into two grey smudges, and the reference is light enough to keep them open.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Belman Lab">
